<div class="fm-stats-counter" style="--fm-stats-counter-accent: ${configuration.accent};">
	<p class="fm-stats-counter__figure">
		<span class="fm-stats-counter__affix">${configuration.prefix?html}</span><span class="fm-stats-counter__value" data-decimals="${configuration.decimals}" data-target="${configuration.value}">${configuration.value}</span><span class="fm-stats-counter__affix">${configuration.suffix?html}</span>
	</p>

	<p class="fm-stats-counter__label" data-lfr-editable-id="label" data-lfr-editable-type="text">Customers worldwide</p>
</div>
